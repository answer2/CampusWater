[versions]
agp = "9.2.1"
# backdrop(Liquid Glass) 2.0.1 编译自 Compose 1.12 / Kotlin 2.3.21，
# 整个栈必须一起升，否则 Kotlin 元数据版本对不上读不了它的类。
kotlin = "2.3.21"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
# 支付宝 App 支付 SDK（充值用）
alipaySdk = "15.8.16"

# Compose 与 Miuix 版本必须成对：Miuix 0.7.2 编译自 JetBrains Compose 1.9.3
# （对应 androidx.compose 1.9.3），Kotlin/Compose 编译器用 2.2.21。
# 注意：material3 不要显式加依赖 —— androidx 侧不存在 1.9.3，交给 Miuix 传递。
compose = "1.12.0"
activityCompose = "1.12.4"
lifecycle = "2.10.0"
coreKtx = "1.17.0"
miuix = "0.7.2"
# Liquid Glass 效果库（Kyant0/AndroidLiquidGlass，产物名 backdrop）
backdrop = "2.0.1"
# backdrop 的形状（Capsule 等）在独立构件里
shapes = "1.2.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
alipay-sdk = { group = "com.alipay.sdk", name = "alipaysdk-android", version.ref = "alipaySdk" }

core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }

compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "compose" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
miuix = { group = "top.yukonga.miuix.kmp", name = "miuix", version.ref = "miuix" }
backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop" }
kyant-shapes = { group = "io.github.kyant0", name = "shapes", version.ref = "shapes" }
compose-ui-util = { group = "androidx.compose.ui", name = "ui-util", version.ref = "compose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
